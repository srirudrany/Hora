# Deploys PanchangaSky/ (static, no build step) to GitHub Pages.
# One-time setup by a repo admin: Settings → Pages → Source: "GitHub Actions",
# and allow the panchanga-sky branch in the github-pages environment rules.
name: Deploy PanchangaSky to Pages
on:
  push:
    branches: [panchanga-sky]
    paths: ['PanchangaSky/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: PanchangaSky
      - id: deployment
        uses: actions/deploy-pages@v4
